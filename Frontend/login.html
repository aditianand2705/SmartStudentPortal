<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Smart Student Management</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>Smart Student Management</h1>

            <h2>Admin Login</h2>

            <form id="loginForm">

                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter admin username"
                        required
                    >

                </div>

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>

                <button type="submit">
                    Login
                </button>

                <p id="errorMessage"></p>

            </form>

        </div>

    </div>

    <script src="login.js"></script>

</body>

</html>
